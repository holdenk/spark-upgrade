name: Build and test

on:
  # Only main on push. Branch work is covered by `pull_request` below, which tests
  # the merge commit -- the thing that actually lands. Keeping `'**'` here as well
  # would run every branch push a second time alongside its PR, and no concurrency
  # key can merge that pair cleanly: the two events test *different commits* (branch
  # HEAD vs merge commit), so collapsing them into one group just makes which commit
  # got tested a race. Pushing a branch with no PR open now gets no CI; open the PR.
  push:
    branches:
    - 'main'
  pull_request:
    # `synchronize` is the one that matters: without it a PR only ever gets CI on
    # the first open and never on follow-up commits. Previously `push` happened to
    # cover that for same-repo branches, but never for forks, because a push to a
    # fork branch does not fire this repo's `push` event. (No `ready_for_review`:
    # draft PRs already run on opened/synchronize, so it would only add a duplicate
    # run when the draft flag flips.)
    types: [opened, reopened, synchronize]

# Supersede stale runs of the same PR: a new push makes the older run pointless.
# Keyed per-PR, but per-COMMIT on main. Keying main by ref instead would put every
# merge in one group, and since a group only ever holds one in-progress plus one
# pending run, a third merge arriving during a long run silently cancels the
# second's queued one -- a merged commit left with a cancelled result, which is
# exactly the symptom that let the release job die unnoticed for 50 commits.
# Per-SHA groups never collide, so main runs neither queue nor cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Build: build and run the tests for specified modules.
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
    # Action majors: checkout v7, setup-java v6, setup-python v7, cache v6 and
    # coursier/cache-action v9 all declare `runs.using: node24`. The previous pins
    # (checkout/cache/setup-java v4, setup-python v5, coursier v6) were node20
    # actions, and since June 2026 the runner has only run those by forcing them
    # onto Node 24 with a deprecation warning on every job -- Node 20 itself was
    # removed from the runner on 2026-09-23. The v6/v7 lines are ESM rewrites of
    # the same inputs, so none of the usages below change. The coursier bump is
    # the one with a visible effect: its cache layout and keys changed, so the
    # first run after this lands starts from a cold coursier cache.
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    # After checkout, not before: this action keys its cache on the build
    # definition files (*.sbt, project/**, build.properties), which do not exist
    # yet if it runs first.
    - uses: coursier/cache-action@v9
    # Pin the toolchain rather than inheriting whatever the runner image ships.
    # This build is not JDK-agnostic -- the oldest Scala versions here predate
    # recent JDKs -- and ubuntu-22.04 merely happens to default to JDK 11 today.
    # Saying it out loud means a runner image bump cannot silently change the
    # compiler we build with.
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '11'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    # sqlfluff 2.3.2 declares an unpinned `click`, and it breaks on click >= 8.2
    # (ValueError on the deprecated `disable_progress_bar` option). Pinning the
    # Python version means pip resolves click itself instead of silently reusing
    # the runner image's system click 8.0.3, so sql/requirements.txt caps click.
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Install python deps
      run: pip install -r sql/requirements.txt
    # One flake8 run for the whole repo, configured by ./.flake8 rather than by
    # flags duplicated in this file. Previously only sql/ was linted, so
    # conf_migrate/ and e2e_demo/ drifted unchecked. pipelinecompare/ is still
    # excluded in .flake8 -- see the note there.
    - name: Python Lint Checks
      run: flake8
    - name:  SQL Module - Install and Test
      run: cd sql; pip install -e .; pytest .
    # Run the scala tests.
    # Two tasks, both needed: scalafmtCheckAll covers Compile/Test sources only,
    # while .sbt and project/*.scala are a separate task (scalafmtSbtCheck) -- so
    # checking only the former left scalafix/build.sbt, the most heavily edited
    # file here, permanently unchecked. And `+` because rules/src/main/scala-2.11
    # and scala-2.13 are only on the source path when building at those Scala
    # versions, so a plain 2.12 run never looks at them.
    # Both sbt builds are listed: they are independent, and each points
    # scalafmtConfig at the single .scalafmt.conf at the repo root.
    - name: Scala style checks
      run: |
        cd scalafix; sbt +scalafmtCheckAll scalafmtSbtCheck; cd ..
        cd iceberg-spark-upgrade-wap-plugin; sbt scalafmtCheckAll scalafmtSbtCheck
    - name: Run scalafix sbt Spark 2.3.2 tests
      run: cd scalafix; sbt ";clean;compile;test" -DsparkVersion=2.3.2
    - name: Run scalafix sbt Spark 2.1.1 tests
      run: cd scalafix; sbt ";clean;compile;test" -DsparkVersion=2.1.1
    - name: Run sbt tests on scalafix & publish the rules locally
      # Explicit `shell: bash` so we get -o pipefail; the implicit default is
      # plain `bash -e`, under which a failing sbt inside the command
      # substitution below would be masked by the exit status of `tr`.
      shell: bash
      run: |
        cd scalafix
        # No bare `publishLocal`: scalaVersion is in crossScalaVersions, so
        # `+publishLocal` already covers it -- the pair was a duplicate ivy write.
        # Both cross-publishes stay: only _2.12 is actually consumed (the sbt demo
        # resolves via %% at 2.12, the gradle one asks for _2.12 by name), but
        # running them across the cross list is what proves the 2.13 artifact this
        # change adds actually publishes, which is the regression guard for it.
        sbt ";clean;compile;test;+publishLocal;+publishM2"
        # Resolve the version we just published so the e2e demos exercise THIS
        # commit's rules. The previous pipeline grepped for a literal "[info]",
        # which sbt's ANSI-coloured output never contains, so it wrote an empty
        # file and both demos silently fell back to their hardcoded default
        # versions -- testing the last Maven Central release, not this build.
        version="$(sbt --no-colors -Dsbt.log.noformat=true -Dsbt.supershell=false \
          --error 'print rules/version' | tail -n1 | tr -d '\r')"
        # Anchored regex, not a glob: `case` globs are unanchored, so
        # [0-9]*.[0-9]* also accepts things like "0 errors found in 1.2 s" -- any
        # stray last line from the sbt runner or a plugin would sail through and
        # become the version, resurfacing 15 minutes later as an unresolvable
        # dependency in the e2e steps.
        if [[ ! $version =~ ^[0-9]+\.[0-9]+ ]]; then
          echo "::error::could not determine the scalafix rules version (got '$version')"
          exit 1
        fi
        echo "SCALAFIX_RULES_VERSION=$version" >> "$GITHUB_ENV"
        echo "Locally published scalafix rules version: $version"
    - name: Run sbt tests on our WAP plugin
      run: cd iceberg-spark-upgrade-wap-plugin; sbt ";clean;test"
    - name: PySparkler - Make Install
      run: |
        cd pysparkler
        make install
    - name: PySparkler - Make Lint
      run: |
        cd pysparkler
        make lint
    - name: PySparkler - Make Test
      run: |
        cd pysparkler
        make test
    # Hash the scripts that decide what gets downloaded into the keys: a key of
    # just ${{ runner.os }}-tgz is never re-saved once it hits, so a Spark version
    # bump in run_demo.sh would only pick up new archives when the entry happened
    # to age out of GitHub's 7-day eviction.
    #
    # Deliberately NO `restore-keys`. A prefix fallback looks like a free speed-up
    # but it can pair entries from different generations: `hadoop-2*` below matches
    # both `hadoop-2.7.0.tar.gz` and the extracted `hadoop-2.7.0/`, and
    # dl_dependencies.sh re-extracts only `if [ ! -d hadoop-2.7.0 ]`, so a restored
    # stale tree would be used silently next to a fresh tarball. Keying every entry
    # on the same hash keeps all four caches in lockstep. The cost is that editing
    # any of the three scripts re-downloads ~830 MB once; correctness is worth more
    # than that, and these scripts change rarely.
    - name: Cache tgzs
      id: cache-tgz
      uses: actions/cache@v6
      with:
        path: e2e_demo/scala/*.tgz
        key: ${{ runner.os }}-tgz-${{ hashFiles('e2e_demo/scala/dl_dependencies.sh', 'e2e_demo/scala/run_demo.sh', 'e2e_demo/scala/run_demo-gradle.sh') }}
    - name: Cache tar.gz
      id: cache-targz
      uses: actions/cache@v6
      with:
        path: e2e_demo/scala/*.tar.gz
        key: ${{ runner.os }}-targz-${{ hashFiles('e2e_demo/scala/dl_dependencies.sh', 'e2e_demo/scala/run_demo.sh', 'e2e_demo/scala/run_demo-gradle.sh') }}
    - name: Cache extractions spark 3
      id: cache-extract-spark3
      uses: actions/cache@v6
      with:
        path: e2e_demo/scala/spark-3.3.1-bin-hadoop2
        key: ${{ runner.os }}-extract-spark3-${{ hashFiles('e2e_demo/scala/dl_dependencies.sh', 'e2e_demo/scala/run_demo.sh', 'e2e_demo/scala/run_demo-gradle.sh') }}
    - name: Cache extractions hadoop
      id: cache-extract-hadoop
      uses: actions/cache@v6
      with:
        path: e2e_demo/scala/hadoop-2*
        key: ${{ runner.os }}-extract-hadoop2-${{ hashFiles('e2e_demo/scala/dl_dependencies.sh', 'e2e_demo/scala/run_demo.sh', 'e2e_demo/scala/run_demo-gradle.sh') }}
    # Run the sbt e2e demo with the local version
    - name: sbt e2e demo
      run: cd e2e_demo/scala; NO_PROMPT="yes" ./run_demo.sh
    # Run the gradle e2e demo with the local version
    - name: gradle e2e demo
      run: cd e2e_demo/scala; NO_PROMPT="yes" ./run_demo-gradle.sh
