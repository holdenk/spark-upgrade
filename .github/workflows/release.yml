name: Release
on:
  push:
    branches: [master, main]
    tags: ["*"]

permissions:
  contents: read

jobs:
  publish:
    # This was ubuntu-20.04, which GitHub has retired. A job asking for a retired
    # label is never assigned a runner: it just sits queued until the 24h ceiling
    # and is reported as "cancelled". Every main push since the retirement did
    # that, so the scalafix rules stopped being released entirely (dynver is at
    # 0.1.15+50, i.e. 50 commits past the last published tag) without anything
    # ever going red.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # olafurpg/setup-scala is unmaintained (last commit 2023) and wraps Jabba.
      # setup-java + setup-sbt is the supported path, and it lets us pin the JDK
      # instead of inheriting the image default.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
      - uses: sbt/setup-sbt@v1
      # Where the artifacts go changed under us. Sonatype shut down the legacy
      # OSSRH host (oss.sonatype.org) on 2025-06-30; once the runner-label fix
      # above let this job run again, every attempt died inside sbt-ci-release
      # 1.5.11 with "HTTP response code: 405" from
      # oss.sonatype.org/content/repositories/snapshots. sbt-ci-release 1.11+
      # (scalafix/project/plugins.sbt) publishes to the Central Portal instead:
      # SNAPSHOTs to https://central.sonatype.com/repository/maven-snapshots/,
      # tagged releases through the Portal's bundle upload. Two things about the
      # Portal are *account* settings, not build settings, so they cannot be fixed
      # from this repository and are checked up front instead of 20 minutes in:
      #   - SONATYPE_USERNAME / SONATYPE_PASSWORD must be the two halves of a
      #     Portal *user token* (central.sonatype.com -> account -> Generate User
      #     Token). The old OSSRH credentials are rejected by the new host.
      #   - SNAPSHOT publishing is off by default per namespace; it has to be
      #     enabled for com.holdenkarau on central.sonatype.com or every main
      #     push (a -SNAPSHOT version by dynver) will fail at upload.
      - name: Check publishing secrets are present
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: |
          missing=()
          [[ -n "$SONATYPE_USERNAME" ]] || missing+=(SONATYPE_USERNAME)
          [[ -n "$SONATYPE_PASSWORD" ]] || missing+=(SONATYPE_PASSWORD)
          # Signing is only enforced for releases; sbt-ci-release publishes
          # SNAPSHOTs unsigned when PGP_SECRET is absent.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ -n "$PGP_SECRET" ]] || missing+=(PGP_SECRET)
          fi
          if (( ${#missing[@]} )); then
            echo "::error::missing repository secret(s): ${missing[*]}. The Sonatype values must be a Central Portal user token, not an OSSRH login."
            exit 1
          fi
      - name: Release 2.4.8 -> 3.3
        run: |
          cd scalafix
          sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      - name: Release 2.3.2 -> 3.3
        run: |
          cd scalafix
          sbt ci-release -DsparkVersion=2.3.2
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      - name: Release 2.1.1 -> 3.3
        run: |
          cd scalafix
          sbt ci-release -DsparkVersion=2.1.1
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
  pypi-publish-pysparkler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PySparkler
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish PySparkler Package on PyPI
        run: |
          cd pysparkler
          make publish
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYSPARKLER_PYPI_API_TOKEN }}
