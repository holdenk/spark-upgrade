# sbt 2.x is a different build system, not a point upgrade: both sbt builds here
# (scalafix/ and iceberg-spark-upgrade-wap-plugin/) and the e2e demo project are
# sbt 1.x builds, and the "Update sbt to 2.0.x" PRs Scala Steward kept opening
# failed CI on the first step every time. Pin the sbt update to the 1.x line so
# Steward still proposes 1.x patch releases but stops proposing 2.x.
updates.pin = [
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." }
]
